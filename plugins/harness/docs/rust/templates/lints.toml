# Lints enforcing CODE_STYLE.md ([lint: ...] tags). Copy into Cargo.toml.
# - Single crate: paste the [lints.*] tables as-is.
# - Workspace: use the [workspace.lints.*] form at the bottom in the root Cargo.toml,
#   and add `[lints] workspace = true` to every member's Cargo.toml.
# Everything is "warn" so local builds keep going; CI runs clippy with -D warnings.
# Pair with templates/clippy.toml (unwrap allowed in tests, bool parameter limit, function length).
# Lints already on by default (ptr_arg, borrowed_box, wrong_self_convention,
# new_without_default, unnecessary_unwrap, len_without_is_empty, ...) are not repeated.
# Only too_many_lines is taken from clippy::pedantic; the group itself stays off.

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
# Libraries only (§8):
# missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"                 # §5
dbg_macro = "warn"                   # §8
todo = "warn"                        # §8
undocumented_unsafe_blocks = "warn"  # §8
wildcard_imports = "warn"            # §7 (use super::* in test modules is allowed)
needless_for_each = "warn"           # §8
fn_params_excessive_bools = "warn"   # §2
too_many_lines = "warn"              # §8 (threshold in clippy.toml)
# Libraries only (§8):
# missing_errors_doc = "warn"
# missing_panics_doc = "warn"

# ---- Workspace form (root Cargo.toml) — same lints, other table names ----
# [workspace.lints.rust]
# rust_2018_idioms = { level = "warn", priority = -1 }
#
# [workspace.lints.clippy]
# unwrap_used = "warn"
# ... (every line of [lints.clippy] above)
# too_many_lines = "warn"
#
# ---- Each member (crates/<name>/Cargo.toml) ----
# [lints]
# workspace = true
